name: Ensure Live Audit Capture

# Self-healing backstop for the primary 5-minute capture schedule.
# A push to this file dispatches the canonical capture immediately; the hourly
# schedule is a second independent backstop if GitHub delays the primary cron.
# This workflow also dispatches the exact-batch rebuild after capture succeeds,
# because workflow_run chaining can be suppressed when the capture itself was
# dispatched by GITHUB_TOKEN.
on:
  push:
    paths:
      - '.github/workflows/ensure-live-audit.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ensure-live-audit-capture
  cancel-in-progress: true

jobs:
  dispatch-capture-and-batches:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical capture and wait for verified completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          ref="${GITHUB_REF_NAME:-main}"
          before=$(gh api "/repos/$repo/actions/workflows/capture-live-audit.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$repo/actions/workflows/capture-live-audit.yml/dispatches" \
            -f ref="$ref"

          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh api "/repos/$repo/actions/workflows/capture-live-audit.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq ".workflow_runs[] | select(.id > $before) | .id" | head -n1 || true)
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'Capture dispatch did not create a run' >&2; exit 1; }

          for i in $(seq 1 90); do
            status=$(gh api "/repos/$repo/actions/runs/$run_id" --jq '.status')
            conclusion=$(gh api "/repos/$repo/actions/runs/$run_id" --jq '.conclusion // ""')
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || { echo "Capture run $run_id failed: $conclusion" >&2; exit 1; }
              break
            fi
            sleep 5
          done
          status=$(gh api "/repos/$repo/actions/runs/$run_id" --jq '.status')
          conclusion=$(gh api "/repos/$repo/actions/runs/$run_id" --jq '.conclusion // ""')
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] || { echo "Capture run $run_id did not finish successfully" >&2; exit 1; }

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$repo/actions/workflows/build-20-batch-summary.yml/dispatches" \
            -f ref="$ref"

          echo "Verified capture run $run_id and dispatched exact-batch rebuild."
