name: Analyze Canonical Self-Healing Cycle
on:
  push:
    paths:
      - '.github/workflows/analyze-self-healing-cycle-1209.yml'
      - 'audit/exact-20-batch-status.json'
  workflow_dispatch:
  schedule:
    - cron: '25 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: canonical-self-healing-learning
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Analyze all canonical batches beyond reporting watermark
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, datetime, collections, re
          root=pathlib.Path('.')
          status=json.loads((root/'audit/exact-20-batch-status.json').read_text())
          state=json.loads((root/'audit/automation-state-20-batch.json').read_text())
          files=[]
          for key,t in status['tracks'].items():
            pair=t['pair'].lower(); h=int(t['horizon']); prev=int(state.get('reportedBatches',{}).get(key,0)); curr=int(t['completed20Batches'])
            for b in range(prev+1,curr+1): files.append(root/f'audit/new-batches/{pair}-{h}m-batch-{b}.json')
          def streaks(decided):
            runs=[]; cur=0; mx=0
            for x in decided:
              if x=='LOSS': cur+=1; mx=max(mx,cur)
              else:
                if cur:runs.append(cur)
                cur=0
            if cur:runs.append(cur)
            return {'maxLossStreak':mx,'lossRuns2Plus':sum(x>=2 for x in runs),'lossRuns3Plus':sum(x>=3 for x in runs),'lossRuns4Plus':sum(x>=4 for x in runs),'lossRuns5Plus':sum(x>=5 for x in runs)}
          def bucket_conf(v):
            v=float(v or 0)
            return '57-59' if v<60 else '60-64' if v<65 else '65-69' if v<70 else '70+'
          def session_hour(ms):
            if not ms:return ('UNKNOWN','UNKNOWN')
            dt=datetime.datetime.fromtimestamp(ms/1000,datetime.timezone.utc)+datetime.timedelta(hours=5); h=dt.hour
            s='LONDON_PRE_OPEN' if 10<=h<12 else 'LONDON_OPEN_EARLY' if 12<=h<15 else 'LONDON_MID' if 15<=h<17 else 'LONDON_NY_OVERLAP' if 17<=h<21 else 'NEW_YORK_LATE' if 21<=h<24 else 'OFF_SESSION'
            return s,f'{h:02d}:00'
          def stat(rows):
            w=sum(r.get('result')=='WIN' for r in rows); l=sum(r.get('result')=='LOSS' for r in rows); t=sum(r.get('result')=='TIE' for r in rows); d=w+l
            return {'n':len(rows),'wins':w,'losses':l,'ties':t,'accuracyExTies':round(100*w/d,2) if d else None}
          def batch_meta(path,b):
            if isinstance(b,dict):
              return b.get('pair'),b.get('horizon'),b.get('batchNumber')
            m=re.match(r'([a-z]+)-(\d+)m-batch-(\d+)\.json$',path.name)
            if not m:return None,None,None
            return m.group(1).upper(),int(m.group(2)),int(m.group(3))
          reports=[]
          for p in files:
            if not p.exists(): continue
            b=json.loads(p.read_text())
            rows=b if isinstance(b,list) else b.get('results',b.get('records',[]))
            if not isinstance(rows,list): raise SystemExit(f'malformed batch rows in {p}')
            if len(rows)!=20: raise SystemExit(f'{p} has {len(rows)} rows, expected exactly 20')
            ids=[r.get('id') for r in rows]
            if any(not x for x in ids) or len(ids)!=len(set(ids)): raise SystemExit(f'missing/duplicate permanent signal id in {p}')
            if any(r.get('result') not in ('WIN','LOSS','TIE') for r in rows): raise SystemExit(f'malformed result in {p}')
            decided=[r.get('result') for r in rows if r.get('result') in ('WIN','LOSS')]
            groups={k:collections.defaultdict(list) for k in ['confidence','direction','regime','session','hour','safeguard']}
            for r in rows:
              groups['confidence'][bucket_conf(r.get('confidence',r.get('probability',0)))].append(r); groups['direction'][r.get('direction','UNKNOWN')].append(r); groups['regime'][r.get('regime','UNKNOWN')].append(r)
              s,h=session_hour(r.get('signalBoundary') or r.get('signalBoundaryMs') or r.get('createdAt')); groups['session'][s].append(r); groups['hour'][h].append(r)
              f=r.get('features') or {}; tags=set()
              for field in ['safeguardTags','vetoReasons','warnings','diagnosticTags']:
                val=f.get(field,r.get(field,[])); tags.update(val if isinstance(val,list) else [])
              for k,v in f.items():
                if isinstance(v,bool) and v and any(x in k.lower() for x in ['guard','gate','conflict','risk','fresh','breakout','fvg','sweep','rejection','alignment','progress']): tags.add(k)
              for tag in tags: groups['safeguard'][tag].append(r)
            pair,horizon,batch_number=batch_meta(p,b)
            rep={'file':str(p),'pair':pair,'horizon':horizon,'batchNumber':batch_number,'summary':stat(rows),**streaks(decided),'breakdowns':{k:{g:stat(v) for g,v in vals.items()} for k,vals in groups.items()}}
            shadow=[r for r in rows if ((r.get('shadow') or r.get('shadowModel') or {}).get('status')=='READY')]
            rep['shadow']={'ready':len(shadow),'agreements':sum((r.get('shadow') or r.get('shadowModel') or {}).get('direction')==r.get('direction') for r in shadow),'disagreements':sum((r.get('shadow') or r.get('shadowModel') or {}).get('direction')!=r.get('direction') for r in shadow)}
            reports.append(rep)
          out={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'integrityStatus':'PASS' if all(t['integrity']['malformed']==t['integrity']['duplicateIds']==t['integrity']['duplicateBoundaries']==t['integrity']['contradictions']==0 for t in status['tracks'].values()) else 'FAIL','lineageRule':status['lineageRule'],'newBatchCount':len(reports),'batches':reports,'decision':'EVIDENCE_REVIEW_REQUIRED' if reports else 'NO_NEW_BATCH'}
          (root/'audit/self-healing-latest.json').write_text(json.dumps(out,indent=2))
          if reports:
            for key,t in status['tracks'].items(): state.setdefault('reportedBatches',{})[key]=int(t['completed20Batches'])
            state['lastReportedAt']=out['generatedAt']; state['lastAnalysisBatchCount']=len(reports); state['lastAnalysisSource']='audit/self-healing-latest.json'; (root/'audit/automation-state-20-batch.json').write_text(json.dumps(state,indent=2)+'\n')
          PY
      - name: Commit analysis and watermark atomically
        run: |
          git config user.name 'Forex Falcon Audit Bot'
          git config user.email 'audit-bot@users.noreply.github.com'
          git add audit/self-healing-latest.json audit/automation-state-20-batch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: analyze canonical self-healing cycle'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
