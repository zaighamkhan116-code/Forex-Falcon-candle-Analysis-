name: Capture Live Core FX Audit

# Keep repository audit snapshots compact. Full forward history stays on the live server.
on:
  push:
    paths:
      - '.github/workflows/capture-live-audit.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-live-core-fx-audit
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch compact live forward-test state for core FX markets
        env:
          BASE_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/research/background
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
          RETAIN_PER_PAIR: '500'
        run: |
          set -euo pipefail
          mkdir -p audit/live audit/resolved audit/pending
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$BASE_URL/$pair" -o "/tmp/$slug.json"
            jq -e --arg pair "$pair" '.pair == $pair and (.horizons | type == "object")' "/tmp/$slug.json" >/dev/null

            # Store only the fields needed for live audit/batch diagnosis. Large model,
            # candle and auxiliary state remains on Railway and is fetched on demand.
            jq --argjson keep "$RETAIN_PER_PAIR" '
              {
                pair,
                capturedAt:(now*1000|floor),
                horizons:(.horizons | with_entries(.value = {
                  horizon:(.value.horizon // null),
                  recent:((.value.recent // []) | sort_by(.resolvedAt // .expiry // .signalBoundary // 0) | .[-$keep:]),
                  pendingRecent:((.value.pendingRecent // []) | sort_by(.signalBoundary // .predictedAt // 0) | .[-100:])
                }))
              }
            ' "/tmp/$slug.json" > "audit/live/$slug.json"

            [ -f "audit/resolved/$slug.json" ] || echo '[]' > "audit/resolved/$slug.json"
            jq '[.horizons[]?.recent[]?]' "/tmp/$slug.json" > "/tmp/$slug-new-resolved.json"
            jq -s --arg pair "$pair" --argjson keep "$RETAIN_PER_PAIR" '
              (.[0] + .[1])
              | unique_by(.id // ((.pair // $pair) + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .predictedAt // .resolvedAt // 0)|tostring)))
              | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)
              | .[-$keep:]
            ' "audit/resolved/$slug.json" "/tmp/$slug-new-resolved.json" > "/tmp/$slug-merged.json"
            mv "/tmp/$slug-merged.json" "audit/resolved/$slug.json"
            jq '[.horizons[]?.pendingRecent[]?] | sort_by(.signalBoundary // .predictedAt // 0) | .[-100:]' "/tmp/$slug.json" > "audit/pending/$slug.json"
          done

      - name: Capture compact visible app forward-test history
        env:
          HEALTH_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/health
          CONFIG_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/config
          APP_RETAIN: '500'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$HEALTH_URL" -o /tmp/app-health.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$CONFIG_URL" -o /tmp/app-config.json
          jq -e '.engine and (.engine.history | type == "array")' /tmp/app-health.json >/dev/null

          # IMPORTANT: replacing engine.history was not enough because engine contains
          # other very large state. Whitelist only audit-relevant engine fields.
          jq --argjson keep "$APP_RETAIN" '{
            capturedAt:(now*1000|floor),
            serverTime,
            engine:{
              history:((.engine.history // []) | sort_by(.resolvedAt // .signalBoundary // 0) | .[-$keep:]),
              running:(.engine.running // null),
              pair:(.engine.pair // null),
              timeframe:(.engine.timeframe // .engine.horizon // null),
              session:(.engine.session // null),
              regime:(.engine.regime // null)
            }
          }' /tmp/app-health.json > audit/live-app.json

          [ -f audit/resolved-app.json ] || echo '[]' > audit/resolved-app.json
          jq '[.engine.history[]? | select(.result != "PENDING")]' /tmp/app-health.json > /tmp/app-new-resolved.json
          jq -s --argjson keep "$APP_RETAIN" '
            (.[0] + .[1])
            | unique_by(.id // ((.pair // "UNKNOWN") + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .resolvedAt // 0)|tostring)))
            | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)
            | .[-$keep:]
          ' audit/resolved-app.json /tmp/app-new-resolved.json > /tmp/app-resolved-merged.json
          mv /tmp/app-resolved-merged.json audit/resolved-app.json
          jq '[.engine.history[]? | select(.result == "PENDING")] | sort_by(.signalBoundary // 0) | .[-100:]' /tmp/app-health.json > audit/pending-app.json
          jq '{minimumProbability,targetSignals,thresholdValidation,settlement,recovery}' /tmp/app-config.json > audit/app-config.json

      - name: Build compact combined audit snapshot
        run: |
          set -euo pipefail
          jq -s 'map({key:.pair,value:.}) | from_entries' audit/live/*.json > audit/live-core-fx.json
          jq -s 'add | sort_by(.resolvedAt // .expiry // .signalBoundary // 0) | .[-2500:]' audit/resolved/*.json > audit/resolved-core-fx.json
          jq -s 'add | sort_by(.signalBoundary // .predictedAt // 0) | .[-500:]' audit/pending/*.json > audit/pending-core-fx.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg pairs "EURUSD GBPUSD EURJPY USDJPY AUDUSD" \
            --argjson resolvedCount "$(jq 'length' audit/resolved-core-fx.json)" \
            --argjson pendingCount "$(jq 'length' audit/pending-core-fx.json)" \
            --argjson appResolvedCount "$(jq 'length' audit/resolved-app.json)" \
            --argjson appPendingCount "$(jq 'length' audit/pending-app.json)" \
            --argjson minimumConfidence "$(jq '.minimumProbability // 57' audit/app-config.json)" \
            '{capturedAt:$capturedAt,pairs:($pairs|split(" ")),timeframes:[1,2,3,5,15],resolvedRetainedCount:$resolvedCount,pendingRetainedCount:$pendingCount,visibleAppResolvedRetainedCount:$appResolvedCount,visibleAppPendingRetainedCount:$appPendingCount,minimumConfidence:$minimumConfidence,visibleAppCapture:true,storageMode:"bounded-recent",fullHistorySource:"live-server"}' > audit/capture-status.json

      - name: Build compact pair-timeframe batch audit snapshot
        env:
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
          HORIZONS: 1 2 3 5 15
        run: |
          set -euo pipefail
          mkdir -p audit/track-tail
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{capturedAt:$capturedAt,storageMode:"bounded-recent",tracks:{}}' > /tmp/track-status.json
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            for horizon in $HORIZONS; do
              key="${pair}-${horizon}M"
              current=$(jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | length' "audit/resolved/$slug.json")
              jq --arg key "$key" --arg pair "$pair" --argjson horizon "$horizon" --argjson retained "$current" '.tracks[$key]={pair:$pair,horizon:$horizon,retainedResolved:$retained}' /tmp/track-status.json > /tmp/track-status-next.json
              mv /tmp/track-status-next.json /tmp/track-status.json
              jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | sort_by(.resolvedAt // .expiry // .signalBoundary // 0) | .[-60:]' "audit/resolved/$slug.json" > "audit/track-tail/$slug-${horizon}m.json"
            done
          done
          mv /tmp/track-status.json audit/track-status.json

      - name: Guard repository audit size
        run: |
          set -euo pipefail
          oversized=$(find audit -type f -size +45M -print)
          if [ -n "$oversized" ]; then
            echo 'Audit file exceeded 45 MB safety cap:'
            echo "$oversized"
            exit 1
          fi

      - name: Commit changed audit data safely
        run: |
          set -euo pipefail
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/live audit/resolved audit/pending audit/live-core-fx.json audit/resolved-core-fx.json audit/pending-core-fx.json audit/live-app.json audit/resolved-app.json audit/pending-app.json audit/app-config.json audit/capture-status.json audit/track-status.json audit/track-tail
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "audit: capture bounded live core FX forward-test data"
          git pull --rebase origin main
          git push origin main
