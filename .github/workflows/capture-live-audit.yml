name: Capture Live Core FX Audit

# Keep repository audit snapshots compact while maintaining an append-only,
# restart-safe canonical settled-result history for deterministic 20-result batching.
on:
  push:
    paths:
      - '.github/workflows/capture-live-audit.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-live-core-fx-audit
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch compact live forward-test state for core FX markets
        env:
          BASE_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/research/background
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
          RETAIN_PER_PAIR: '500'
        run: |
          set -euo pipefail
          mkdir -p audit/live audit/resolved audit/pending audit/canonical audit/integrity
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$BASE_URL/$pair" -o "/tmp/$slug.json"
            jq -e --arg pair "$pair" '.pair == $pair and (.horizons | type == "object")' "/tmp/$slug.json" >/dev/null

            jq --argjson keep "$RETAIN_PER_PAIR" '{
              pair,
              capturedAt:(now*1000|floor),
              horizons:(.horizons | with_entries(.value = {
                horizon:(.value.horizon // null),
                recent:((.value.recent // []) | sort_by(.resolvedAt // .expiry // .signalBoundary // 0) | .[-$keep:]),
                pendingRecent:((.value.pendingRecent // []) | sort_by(.signalBoundary // .predictedAt // 0) | .[-100:])
              }))
            }' "/tmp/$slug.json" > "audit/live/$slug.json"

            [ -f "audit/resolved/$slug.json" ] || echo '[]' > "audit/resolved/$slug.json"
            jq '[.horizons[]?.recent[]?]' "/tmp/$slug.json" > "/tmp/$slug-new-resolved.json"
            jq -s --arg pair "$pair" --argjson keep "$RETAIN_PER_PAIR" '
              (.[0] + .[1])
              | unique_by(.id // ((.pair // $pair) + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .predictedAt // .resolvedAt // 0)|tostring)))
              | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)
              | .[-$keep:]
            ' "audit/resolved/$slug.json" "/tmp/$slug-new-resolved.json" > "/tmp/$slug-merged.json"
            mv "/tmp/$slug-merged.json" "audit/resolved/$slug.json"

            [ -f "audit/canonical/$slug.json" ] || echo '[]' > "audit/canonical/$slug.json"
            jq --arg pair "$pair" '[.horizons[]?.recent[]? | select(.result != null and .result != "PENDING") | {
              id:(.id // (($pair) + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .predictedAt // .resolvedAt // 0)|tostring))),
              pair:(.pair // $pair), symbol, horizon, analysisTimeframe,
              predictedAt, signalBoundary, entry, entrySource, entryLockedAt, expiry,
              direction, confidence, qualified, tradeQualified, minimumConfidence, vetoReasons,
              regime, engine,
              features:{
                momentum:.features.momentum, trend:.features.trend, structure:.features.structure,
                rsi:.features.rsi, efficiency:.features.efficiency,
                fvg:.features.fvg, activeFvgType:.features.activeFvgType,
                activeFvgState:.features.activeFvgState, activeFvgFillPct:.features.activeFvgFillPct,
                activeFvgDistanceAtr:.features.activeFvgDistanceAtr, activeFvgBias:.features.activeFvgBias,
                activeFvgTimeframe:.features.activeFvgTimeframe,
                atr:.features.atr, volatility:.features.volatility,
                support:.features.support, resistance:.features.resistance,
                liquidity:.features.liquidity, pattern:.features.pattern, breakout:.features.breakout,
                sequence:.features.sequence, trendline:.features.trendline, sr:.features.sr,
                emaStack:.features.emaStack, emaCompression:.features.emaCompression,
                bbState:.features.bbState, maBbConfirmation:.features.maBbConfirmation,
                maBbTags:.features.maBbTags, divergence:.features.divergence,
                macdState:.features.macdState, adx:.features.adx, adxDirectional:.features.adxDirectional,
                advancedMomentumScore:.features.advancedMomentumScore,
                m5Context:.features.m5Context, m15Context:.features.m15Context, h1Context:.features.h1Context,
                confirmationV2Score:.features.confirmationV2Score,
                confirmationV2Contribution:.features.confirmationV2Contribution,
                confirmationV2Aligned:.features.confirmationV2Aligned,
                confirmationV2Opposed:.features.confirmationV2Opposed,
                transitionRisk:.features.transitionRisk,
                lateCounterTrendRisk:.features.lateCounterTrendRisk,
                adverseZone:.features.adverseZone,
                extendedMove:.features.extendedMove,
                continuationResetRequired:.features.continuationResetRequired,
                continuationFreshEvidence:.features.continuationFreshEvidence,
                progressFailureRisk:.features.progressFailureRisk,
                progressFailureGate:.features.progressFailureGate,
                highConfidenceContradictionRisk:.features.highConfidenceContradictionRisk,
                entryLane:.features.entryLane,
                scoreRedistributionPenaltyTags:.features.scoreRedistributionPenaltyTags,
                scoreRedistributionBonusTags:.features.scoreRedistributionBonusTags,
                frequencyConflicts:.features.frequencyConflicts,
                frequencyStructuralTags:.features.frequencyStructuralTags,
                frequencyFreshEvidence:.features.frequencyFreshEvidence,
                directionEdge:.features.directionEdge,
                directionAlignedEvidence:.features.directionAlignedEvidence,
                originalDirection:.features.originalDirection,
                originalDirectionScore:.features.originalDirectionScore,
                oppositeDirectionScore:.features.oppositeDirectionScore,
                directionReranked:.features.directionReranked,
                forexTickPressure:.features.forexTickPressure,
                forexTickDirection:.features.forexTickDirection,
                forexTickQuality:.features.forexTickQuality,
                forexTickFeedReliability:.features.forexTickFeedReliability,
                forexTickDirectionQuality:.features.forexTickDirectionQuality,
                tickFeedReliabilityScore:.features.tickFeedReliabilityScore,
                tickDirectionQualityScore:.features.tickDirectionQualityScore,
                tickPressure5s:.features.tickPressure5s,
                tickPressure10s:.features.tickPressure10s,
                tickPressure20s:.features.tickPressure20s,
                tickPressure30s:.features.tickPressure30s,
                tickPressure60s:.features.tickPressure60s,
                tickPersistence:.features.tickPersistence,
                tickReversal:.features.tickReversal,
                tickImbalance:.features.tickImbalance,
                tickRate:.features.tickRate,
                tickAdaptiveRateBaseline:.features.tickAdaptiveRateBaseline,
                tickDensityScore:.features.tickDensityScore,
                tickContinuityScore:.features.tickContinuityScore,
                tickFreshnessScore:.features.tickFreshnessScore,
                tickSpreadHealthScore:.features.tickSpreadHealthScore,
                tickEfficiency:.features.tickEfficiency,
                tickAcceleration:.features.tickAcceleration,
                spreadChange:.features.spreadChange,
                forexTickAgreement:.features.forexTickAgreement,
                forexTickWeight:.features.forexTickWeight,
                allTickWindowsAgree:.features.allTickWindowsAgree,
                fastTickWindowsAgree:.features.fastTickWindowsAgree,
                lossStreakCalibrationVersion:.features.lossStreakCalibrationVersion,
                lossStreakRerankApplied:.features.lossStreakRerankApplied,
                lossStreakRerankTrigger:.features.lossStreakRerankTrigger,
                lossStreakRerankEvidence:.features.lossStreakRerankEvidence,
                lossStreakOriginalDirection:.features.lossStreakOriginalDirection,
                lossStreakRerankedDirection:.features.lossStreakRerankedDirection,
                lossStreakFrequencyImpact:.features.lossStreakFrequencyImpact,
                lossStreakRuntimeConflictCount:.features.lossStreakRuntimeConflictCount,
                lossStreakOpposedFamilies:.features.lossStreakOpposedFamilies,
                lossStreakOpposedFamilyCount:.features.lossStreakOpposedFamilyCount,
                lossStreakCandidateVersion:.features.lossStreakCandidateVersion,
                lossStreakCandidateActive:.features.lossStreakCandidateActive,
                lossStreakCandidateTrigger:.features.lossStreakCandidateTrigger,
                lossStreakCandidateEvidence:.features.lossStreakCandidateEvidence,
                lossStreakCandidateDirection:.features.lossStreakCandidateDirection,
                lossStreakCandidateFrequencyImpact:.features.lossStreakCandidateFrequencyImpact,
                boundaryLockSource:.features.boundaryLockSource
              },
              result, quotexRule, validationMode, tradeSequence, batchNumber, batchIndex, batchKey, batchLocked,
              shadowModel, realtimeEntry, realtimeEntrySource,
              exit, exitSource, priceDifference, resolvedAt,
              settlementRule, settlementSource, settlementBars,
              settlementStartTime, settlementEndTime, settlementCandleOpen, settlementCandleClose,
              settlementCandleBody, authoritativeBoundarySettlement
            }]' "/tmp/$slug.json" > "/tmp/$slug-canonical-new.json"

            jq --arg pair "$pair" '[.[] | select(.result != null and .result != "PENDING") | {
              id:(.id // (($pair) + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .predictedAt // .resolvedAt // 0)|tostring))),
              pair:(.pair // $pair), symbol, horizon, analysisTimeframe,
              predictedAt, signalBoundary, entry, entrySource, entryLockedAt, expiry,
              direction, confidence, qualified, tradeQualified, minimumConfidence, vetoReasons,
              regime, engine,
              features:{
                momentum:.features.momentum, trend:.features.trend, structure:.features.structure,
                rsi:.features.rsi, efficiency:.features.efficiency,
                fvg:.features.fvg, activeFvgType:.features.activeFvgType,
                activeFvgState:.features.activeFvgState, activeFvgFillPct:.features.activeFvgFillPct,
                activeFvgDistanceAtr:.features.activeFvgDistanceAtr, activeFvgBias:.features.activeFvgBias,
                activeFvgTimeframe:.features.activeFvgTimeframe,
                atr:.features.atr, volatility:.features.volatility,
                support:.features.support, resistance:.features.resistance,
                liquidity:.features.liquidity, pattern:.features.pattern, breakout:.features.breakout,
                sequence:.features.sequence, trendline:.features.trendline, sr:.features.sr,
                emaStack:.features.emaStack, emaCompression:.features.emaCompression,
                bbState:.features.bbState, maBbConfirmation:.features.maBbConfirmation,
                maBbTags:.features.maBbTags, divergence:.features.divergence,
                macdState:.features.macdState, adx:.features.adx, adxDirectional:.features.adxDirectional,
                advancedMomentumScore:.features.advancedMomentumScore,
                m5Context:.features.m5Context, m15Context:.features.m15Context, h1Context:.features.h1Context,
                confirmationV2Score:.features.confirmationV2Score,
                confirmationV2Contribution:.features.confirmationV2Contribution,
                confirmationV2Aligned:.features.confirmationV2Aligned,
                confirmationV2Opposed:.features.confirmationV2Opposed,
                transitionRisk:.features.transitionRisk,
                lateCounterTrendRisk:.features.lateCounterTrendRisk,
                adverseZone:.features.adverseZone,
                extendedMove:.features.extendedMove,
                continuationResetRequired:.features.continuationResetRequired,
                continuationFreshEvidence:.features.continuationFreshEvidence,
                progressFailureRisk:.features.progressFailureRisk,
                progressFailureGate:.features.progressFailureGate,
                highConfidenceContradictionRisk:.features.highConfidenceContradictionRisk,
                entryLane:.features.entryLane,
                scoreRedistributionPenaltyTags:.features.scoreRedistributionPenaltyTags,
                scoreRedistributionBonusTags:.features.scoreRedistributionBonusTags,
                frequencyConflicts:.features.frequencyConflicts,
                frequencyStructuralTags:.features.frequencyStructuralTags,
                frequencyFreshEvidence:.features.frequencyFreshEvidence,
                directionEdge:.features.directionEdge,
                directionAlignedEvidence:.features.directionAlignedEvidence,
                originalDirection:.features.originalDirection,
                originalDirectionScore:.features.originalDirectionScore,
                oppositeDirectionScore:.features.oppositeDirectionScore,
                directionReranked:.features.directionReranked,
                forexTickPressure:.features.forexTickPressure,
                forexTickDirection:.features.forexTickDirection,
                forexTickQuality:.features.forexTickQuality,
                forexTickFeedReliability:.features.forexTickFeedReliability,
                forexTickDirectionQuality:.features.forexTickDirectionQuality,
                tickFeedReliabilityScore:.features.tickFeedReliabilityScore,
                tickDirectionQualityScore:.features.tickDirectionQualityScore,
                tickPressure5s:.features.tickPressure5s,
                tickPressure10s:.features.tickPressure10s,
                tickPressure20s:.features.tickPressure20s,
                tickPressure30s:.features.tickPressure30s,
                tickPressure60s:.features.tickPressure60s,
                tickPersistence:.features.tickPersistence,
                tickReversal:.features.tickReversal,
                tickImbalance:.features.tickImbalance,
                tickRate:.features.tickRate,
                tickAdaptiveRateBaseline:.features.tickAdaptiveRateBaseline,
                tickDensityScore:.features.tickDensityScore,
                tickContinuityScore:.features.tickContinuityScore,
                tickFreshnessScore:.features.tickFreshnessScore,
                tickSpreadHealthScore:.features.tickSpreadHealthScore,
                tickEfficiency:.features.tickEfficiency,
                tickAcceleration:.features.tickAcceleration,
                spreadChange:.features.spreadChange,
                forexTickAgreement:.features.forexTickAgreement,
                forexTickWeight:.features.forexTickWeight,
                allTickWindowsAgree:.features.allTickWindowsAgree,
                fastTickWindowsAgree:.features.fastTickWindowsAgree,
                lossStreakCalibrationVersion:.features.lossStreakCalibrationVersion,
                lossStreakRerankApplied:.features.lossStreakRerankApplied,
                lossStreakRerankTrigger:.features.lossStreakRerankTrigger,
                lossStreakRerankEvidence:.features.lossStreakRerankEvidence,
                lossStreakOriginalDirection:.features.lossStreakOriginalDirection,
                lossStreakRerankedDirection:.features.lossStreakRerankedDirection,
                lossStreakFrequencyImpact:.features.lossStreakFrequencyImpact,
                lossStreakRuntimeConflictCount:.features.lossStreakRuntimeConflictCount,
                lossStreakOpposedFamilies:.features.lossStreakOpposedFamilies,
                lossStreakOpposedFamilyCount:.features.lossStreakOpposedFamilyCount,
                lossStreakCandidateVersion:.features.lossStreakCandidateVersion,
                lossStreakCandidateActive:.features.lossStreakCandidateActive,
                lossStreakCandidateTrigger:.features.lossStreakCandidateTrigger,
                lossStreakCandidateEvidence:.features.lossStreakCandidateEvidence,
                lossStreakCandidateDirection:.features.lossStreakCandidateDirection,
                lossStreakCandidateFrequencyImpact:.features.lossStreakCandidateFrequencyImpact,
                boundaryLockSource:.features.boundaryLockSource
              },
              result, quotexRule, validationMode, tradeSequence, batchNumber, batchIndex, batchKey, batchLocked,
              shadowModel, realtimeEntry, realtimeEntrySource,
              exit, exitSource, priceDifference, resolvedAt,
              settlementRule, settlementSource, settlementBars,
              settlementStartTime, settlementEndTime, settlementCandleOpen, settlementCandleClose,
              settlementCandleBody, authoritativeBoundarySettlement
            }]' "audit/resolved/$slug.json" > "/tmp/$slug-canonical-seed.json"

            jq -s '(.[0] + .[1] + .[2])' "audit/canonical/$slug.json" "/tmp/$slug-canonical-seed.json" "/tmp/$slug-canonical-new.json" > "/tmp/$slug-canonical-all.json"
            contradictions=$(jq '[group_by(.id)[] | select(length>1) | select((map({pair,horizon,signalBoundary,entry,direction,confidence,result,resolvedAt,settlementSource,authoritativeBoundarySettlement})|unique|length)>1)] | length' "/tmp/$slug-canonical-all.json")
            jq -n --arg pair "$pair" --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson contradictions "$contradictions" '{pair:$pair,capturedAt:$capturedAt,permanentIdContradictions:$contradictions}' > "audit/integrity/$slug.json"
            [ "$contradictions" -eq 0 ] || { echo "Contradictory canonical permanent IDs for $pair" >&2; exit 1; }

            jq 'unique_by(.id) | sort_by(.signalBoundary // .resolvedAt // 0, .resolvedAt // 0, .id)' "/tmp/$slug-canonical-all.json" > "/tmp/$slug-canonical-merged.json"
            oldCount=$(jq 'length' "audit/canonical/$slug.json")
            newCount=$(jq 'length' "/tmp/$slug-canonical-merged.json")
            [ "$newCount" -ge "$oldCount" ] || { echo "Canonical history shrank for $pair: $oldCount -> $newCount" >&2; exit 1; }
            mv "/tmp/$slug-canonical-merged.json" "audit/canonical/$slug.json"

            jq '[.horizons[]?.pendingRecent[]?] | sort_by(.signalBoundary // .predictedAt // 0) | .[-100:]' "/tmp/$slug.json" > "audit/pending/$slug.json"
          done

      - name: Capture compact visible app forward-test history
        env:
          HEALTH_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/health
          CONFIG_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/config
          APP_RETAIN: '500'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$HEALTH_URL" -o /tmp/app-health.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$CONFIG_URL" -o /tmp/app-config.json
          jq -e '.engine and (.engine.history | type == "array")' /tmp/app-health.json >/dev/null
          jq --argjson keep "$APP_RETAIN" '{
            capturedAt:(now*1000|floor), serverTime,
            engine:{
              history:((.engine.history // []) | sort_by(.resolvedAt // .signalBoundary // 0) | .[-$keep:]),
              running:(.engine.running // null), pair:(.engine.pair // null),
              timeframe:(.engine.timeframe // .engine.horizon // null),
              session:(.engine.session // null), regime:(.engine.regime // null)
            }
          }' /tmp/app-health.json > audit/live-app.json
          [ -f audit/resolved-app.json ] || echo '[]' > audit/resolved-app.json
          jq '[.engine.history[]? | select(.result != "PENDING")]' /tmp/app-health.json > /tmp/app-new-resolved.json
          jq -s --argjson keep "$APP_RETAIN" '(.[0] + .[1]) | unique_by(.id // ((.pair // "UNKNOWN") + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .resolvedAt // 0)|tostring))) | sort_by(.resolvedAt // .signalBoundary // 0) | .[-$keep:]' audit/resolved-app.json /tmp/app-new-resolved.json > /tmp/app-resolved-merged.json
          mv /tmp/app-resolved-merged.json audit/resolved-app.json
          jq '[.engine.history[]? | select(.result == "PENDING")] | sort_by(.signalBoundary // 0) | .[-100:]' /tmp/app-health.json > audit/pending-app.json
          jq '{minimumProbability,targetSignals,thresholdValidation,settlement,recovery}' /tmp/app-config.json > audit/app-config.json

      - name: Build compact combined audit snapshot
        run: |
          set -euo pipefail
          jq -s 'map({key:.pair,value:.}) | from_entries' audit/live/*.json > audit/live-core-fx.json
          jq -s 'add | sort_by(.resolvedAt // .expiry // .signalBoundary // 0) | .[-2500:]' audit/resolved/*.json > audit/resolved-core-fx.json
          jq -s 'add | sort_by(.signalBoundary // .predictedAt // 0) | .[-500:]' audit/pending/*.json > audit/pending-core-fx.json
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg pairs "EURUSD GBPUSD EURJPY USDJPY AUDUSD" --argjson resolvedCount "$(jq 'length' audit/resolved-core-fx.json)" --argjson pendingCount "$(jq 'length' audit/pending-core-fx.json)" --argjson appResolvedCount "$(jq 'length' audit/resolved-app.json)" --argjson appPendingCount "$(jq 'length' audit/pending-app.json)" --argjson canonicalCount "$(jq -s 'add|length' audit/canonical/*.json)" --argjson minimumConfidence "$(jq '.minimumProbability // 57' audit/app-config.json)" '{capturedAt:$capturedAt,pairs:($pairs|split(" ")),timeframes:[1,2,3,5,15],resolvedRetainedCount:$resolvedCount,pendingRetainedCount:$pendingCount,visibleAppResolvedRetainedCount:$appResolvedCount,visibleAppPendingRetainedCount:$appPendingCount,canonicalSettledCount:$canonicalCount,minimumConfidence:$minimumConfidence,visibleAppCapture:true,storageMode:"bounded-recent+canonical-append-only-restart-safe",canonicalSource:"settled-result-permanent-id-sequence",fullHistorySource:"live-server"}' > audit/capture-status.json

      - name: Build compact pair-timeframe batch audit snapshot
        env:
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
          HORIZONS: 1 2 3 5 15
        run: |
          set -euo pipefail
          mkdir -p audit/track-tail
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{capturedAt:$capturedAt,storageMode:"canonical-append-only-restart-safe",tracks:{}}' > /tmp/track-status.json
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            for horizon in $HORIZONS; do
              key="${pair}-${horizon}M"
              current=$(jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | length' "audit/canonical/$slug.json")
              completed=$((current/20)); rem=$((current%20))
              jq --arg key "$key" --arg pair "$pair" --argjson horizon "$horizon" --argjson retained "$current" --argjson completed "$completed" --argjson rem "$rem" '.tracks[$key]={pair:$pair,horizon:$horizon,canonicalResolved:$retained,completed20Batches:$completed,remainder:$rem}' /tmp/track-status.json > /tmp/track-status-next.json
              mv /tmp/track-status-next.json /tmp/track-status.json
              jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | sort_by(.signalBoundary // .resolvedAt // 0) | .[-60:]' "audit/canonical/$slug.json" > "audit/track-tail/$slug-${horizon}m.json"
            done
          done
          mv /tmp/track-status.json audit/track-status.json

      - name: Guard repository audit size
        run: |
          set -euo pipefail
          oversized=$(find audit -type f -size +45M -print)
          if [ -n "$oversized" ]; then
            echo 'Audit file exceeded 45 MB safety cap:'
            echo "$oversized"
            exit 1
          fi

      - name: Commit changed audit data safely
        run: |
          set -euo pipefail
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/live audit/resolved audit/canonical audit/pending audit/integrity audit/live-core-fx.json audit/resolved-core-fx.json audit/pending-core-fx.json audit/live-app.json audit/resolved-app.json audit/pending-app.json audit/app-config.json audit/capture-status.json audit/track-status.json audit/track-tail
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "audit: capture append-only canonical settled history"
          git pull --rebase origin main
          git push origin main

# automation self-heal retrigger: 2026-09-09T04:04Z scheduled capture stale while production remained active
