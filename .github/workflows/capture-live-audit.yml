name: Capture Live Core FX Audit

on:
  push:
    paths:
      - '.github/workflows/capture-live-audit.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-live-core-fx-audit
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live forward-test state for core FX markets
        env:
          BASE_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/research/background
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
        run: |
          set -euo pipefail
          mkdir -p audit/live audit/resolved audit/pending
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            url="$BASE_URL/$pair"
            echo "Capturing $pair"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 \
              "$url" -o "/tmp/$slug.json"
            jq -e --arg pair "$pair" '.pair == $pair and (.horizons | type == "object")' "/tmp/$slug.json" >/dev/null
            jq '.' "/tmp/$slug.json" > "audit/live/$slug.json"

            [ -f "audit/resolved/$slug.json" ] || echo '[]' > "audit/resolved/$slug.json"
            jq '[.horizons[]?.recent[]?]' "audit/live/$slug.json" > "/tmp/$slug-new-resolved.json"
            jq -s --arg pair "$pair" '
              (.[0] + .[1])
              | unique_by(.id // ((.pair // $pair) + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .predictedAt // .resolvedAt // 0)|tostring)))
              | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)
            ' "audit/resolved/$slug.json" "/tmp/$slug-new-resolved.json" > "/tmp/$slug-merged.json"
            mv "/tmp/$slug-merged.json" "audit/resolved/$slug.json"

            jq '[.horizons[]?.pendingRecent[]?] | sort_by(.signalBoundary // .predictedAt // 0)' \
              "audit/live/$slug.json" > "audit/pending/$slug.json"
          done

      - name: Capture visible app forward-test history
        env:
          HEALTH_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/health
          CONFIG_URL: https://forex-falcon-candle-analysis-production.up.railway.app/api/config
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$HEALTH_URL" -o /tmp/app-health.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 60 "$CONFIG_URL" -o /tmp/app-config.json
          jq -e '.engine and (.engine.history | type == "array")' /tmp/app-health.json >/dev/null
          jq '{capturedAt:(now*1000|floor),serverTime,engine:.engine}' /tmp/app-health.json > audit/live-app.json
          [ -f audit/resolved-app.json ] || echo '[]' > audit/resolved-app.json
          jq '[.engine.history[]? | select(.result != "PENDING")]' /tmp/app-health.json > /tmp/app-new-resolved.json
          jq -s '
            (.[0] + .[1])
            | unique_by(.id // ((.pair // "UNKNOWN") + "-" + ((.horizon // 0)|tostring) + "-" + ((.signalBoundary // .resolvedAt // 0)|tostring)))
            | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)
          ' audit/resolved-app.json /tmp/app-new-resolved.json > /tmp/app-resolved-merged.json
          mv /tmp/app-resolved-merged.json audit/resolved-app.json
          jq '[.engine.history[]? | select(.result == "PENDING")] | sort_by(.signalBoundary // 0)' /tmp/app-health.json > audit/pending-app.json
          jq '{minimumProbability,targetSignals,thresholdValidation,settlement,recovery}' /tmp/app-config.json > audit/app-config.json

      - name: Build combined audit snapshot
        run: |
          set -euo pipefail
          jq -s 'map({key:.pair,value:.}) | from_entries' audit/live/*.json > audit/live-core-fx.json
          jq -s 'add | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)' audit/resolved/*.json > audit/resolved-core-fx.json
          jq -s 'add | sort_by(.signalBoundary // .predictedAt // 0)' audit/pending/*.json > audit/pending-core-fx.json
          jq -n \
            --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg pairs "EURUSD GBPUSD EURJPY USDJPY AUDUSD" \
            --argjson resolvedCount "$(jq 'length' audit/resolved-core-fx.json)" \
            --argjson pendingCount "$(jq 'length' audit/pending-core-fx.json)" \
            --argjson appResolvedCount "$(jq 'length' audit/resolved-app.json)" \
            --argjson appPendingCount "$(jq 'length' audit/pending-app.json)" \
            --argjson minimumConfidence "$(jq '.minimumProbability // 57' audit/app-config.json)" \
            '{capturedAt:$capturedAt,pairs:($pairs|split(" ")),timeframes:[1,2,3,5,15],resolvedCount:$resolvedCount,pendingCount:$pendingCount,visibleAppResolvedCount:$appResolvedCount,visibleAppPendingCount:$appPendingCount,minimumConfidence:$minimumConfidence,visibleAppCapture:true}' \
            > audit/capture-status.json

      - name: Build compact pair-timeframe batch audit snapshot
        env:
          BASELINE_COMMIT: 73ed749d7f34d220f0bbbd2256d4f50987f53534
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
          HORIZONS: 1 2 3 5 15
        run: |
          set -euo pipefail
          mkdir -p audit/track-tail
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg baseline "$BASELINE_COMMIT" \
            '{capturedAt:$capturedAt,baselineCommit:$baseline,tracks:{}}' > /tmp/track-status.json
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            for horizon in $HORIZONS; do
              key="${pair}-${horizon}M"
              current=$(jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | length' "audit/resolved/$slug.json")
              baseline=0
              if git cat-file -e "$BASELINE_COMMIT:audit/resolved/$slug.json" 2>/dev/null; then
                baseline=$(git show "$BASELINE_COMMIT:audit/resolved/$slug.json" | jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | length')
              fi
              delta=$((current-baseline))
              completed=$((delta/20))
              remainder=$((delta%20))
              jq --arg key "$key" --arg pair "$pair" --argjson horizon "$horizon" \
                 --argjson baseline "$baseline" --argjson current "$current" --argjson delta "$delta" \
                 --argjson completed "$completed" --argjson remainder "$remainder" \
                 '.tracks[$key]={pair:$pair,horizon:$horizon,baselineCount:$baseline,currentCount:$current,newSinceBaseline:$delta,completed20Batches:$completed,remainder:$remainder}' \
                 /tmp/track-status.json > /tmp/track-status-next.json
              mv /tmp/track-status-next.json /tmp/track-status.json
              jq --argjson h "$horizon" '[.[] | select((.horizon|tonumber) == $h)] | sort_by(.resolvedAt // .expiry // .signalBoundary // 0) | .[-60:]' \
                "audit/resolved/$slug.json" > "audit/track-tail/$slug-${horizon}m.json"
            done
          done
          mv /tmp/track-status.json audit/track-status.json

      - name: Commit changed audit data
        run: |
          set -euo pipefail
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/live audit/resolved audit/pending audit/live-core-fx.json audit/resolved-core-fx.json audit/pending-core-fx.json audit/live-app.json audit/resolved-app.json audit/pending-app.json audit/app-config.json audit/capture-status.json audit/track-status.json audit/track-tail
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "audit: capture live core FX forward-test data"
          git push
