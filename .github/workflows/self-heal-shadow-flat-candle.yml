name: Self-heal Shadow flat-candle features
on:
  push:
    paths:
      - '.github/workflows/self-heal-shadow-flat-candle.yml'
permissions:
  contents: write
jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch zero-range candle features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ml_shadow/app.py')
          s=p.read_text()
          old='''    rng = (h - l).replace(0, np.nan)\n    x["body"] = (c - o) / rng\n    x["uw"] = (h - np.maximum(o, c)) / rng\n    x["lw"] = (np.minimum(o, c) - l) / rng\n'''
          new='''    raw_rng = h - l\n    rng = raw_rng.replace(0, np.nan)\n    # A completed flat candle has defined zero body/wicks, not missing history.\n    # Preserve NaN handling for genuinely unavailable inputs while preventing\n    # valid zero-range EURUSD candles from being misclassified as NOT_READY.\n    x["body"] = ((c - o) / rng).where(raw_rng.ne(0), 0.0)\n    x["uw"] = ((h - np.maximum(o, c)) / rng).where(raw_rng.ne(0), 0.0)\n    x["lw"] = ((np.minimum(o, c) - l) / rng).where(raw_rng.ne(0), 0.0)\n'''
          if old not in s:
            if 'raw_rng = h - l' in s:
              raise SystemExit('already patched')
            raise SystemExit('feature anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install shadow dependencies
        run: pip install -r requirements-shadow.txt
      - name: Regression check flat final candle
        run: |
          python3 - <<'PY'
          import pandas as pd
          from ml_shadow.app import make_features
          rows=[]
          base=1.10
          for i in range(80):
            o=base+i*0.00001
            c=o+(0.00002 if i%2==0 else -0.00001)
            rows.append({'open':o,'high':max(o,c)+0.00002,'low':min(o,c)-0.00002,'close':c,'volume':1})
          flat=rows[-1]['close']
          rows[-1]={'open':flat,'high':flat,'low':flat,'close':flat,'volume':0}
          x=make_features(pd.DataFrame(rows))
          last=x.iloc[-1]
          assert last['body']==0.0 and last['uw']==0.0 and last['lw']==0.0, last[['body','uw','lw']]
          print('flat-candle regression PASS')
          PY
      - name: Commit repair and audit checkpoint
        run: |
          python3 - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('audit/automation-health-checkpoint-2026-09-10-1459z.json')
          p.write_text(json.dumps({
            'capturedAt':'2026-09-10T14:59:12Z',
            'integrityStatus':'PASS',
            'lineageRule':'CANONICAL_RECORDS_1_20_B1',
            'learnerDecision':'NO_NEW_BATCH',
            'productionDeployment':'SUCCESS',
            'repair':{'component':'Shadow feature extraction','fault':'Valid zero-range EURUSD candle produced NaN body/uw/lw and HTTP 422 NOT_READY despite sufficient history','change':'Map body/upper-wick/lower-wick to 0.0 only when candle high-low is exactly zero','liveSignalImpact':'NONE','shadowAuthority':'NON_AUTHORITATIVE'},
            'strategyChange':'NONE',
            'nextValidation':'Verify supported EURUSD Shadow requests no longer emit flat-candle feature-history 422; continue V6.3 unseen exact-20 validation.'
          },indent=2)+'\n')
          PY
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ml_shadow/app.py audit/automation-health-checkpoint-2026-09-10-1459z.json
          git commit -m "fix: self-heal Shadow flat-candle feature 422"
          git push
