name: Compact batch scorecard
# Audit refresh trigger: 2026-09-03T10:35Z after latest diagnostics, unreported scorecard, concise brief, JSON table, and text table.
on:
  push:
    paths:
      - '.github/workflows/compact-batch-scorecard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/compact_batch_scorecard.py
      - run: |
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/new-batch-scorecard.json audit/unreported-batch-scorecard.json audit/unreported-batch-brief.json audit/unreported-batch-table.json audit/unreported-batch-table.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: compact 20-result batch scorecard"
          git push
