name: Trigger stale capture recovery

on:
  push:
    paths:
      - '.github/workflows/trigger-stale-capture-recovery.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical live capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run capture-live-audit.yml --ref main
