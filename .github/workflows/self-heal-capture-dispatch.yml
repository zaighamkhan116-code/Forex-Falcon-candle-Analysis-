name: Self-heal audit capture dispatch

on:
  push:
    paths:
      - '.github/workflows/self-heal-capture-dispatch.yml'
  schedule:
    - cron: '7 * * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-canonical-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical live capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/capture-live-audit.yml/dispatches \
            -d '{"ref":"main"}'

# 2026-09-07 self-heal retrigger: no logic change; push-path dispatch only.
