name: Refresh stale secondary audits

on:
  push:
    paths:
      - '.github/workflows/selfheal-dispatch-secondary-audits.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch selector and streak audits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for workflow in capture-selector-telemetry.yml analyze-all-track-loss-streaks.yml; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"main"}'
          done
