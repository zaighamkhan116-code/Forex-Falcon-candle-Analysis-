name: Build compact self-healing evidence summary

on:
  push:
    paths:
      - '.github/workflows/selfheal-compact-summary.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compact evidence file
        run: |
          python - <<'PY'
          import json, pathlib, datetime
          p=pathlib.Path('audit/self-healing-latest.json')
          d=json.loads(p.read_text())
          rows=[]; tw=tl=tt=0; sr=sa=sd=0
          for b in d.get('batches',[]):
            s=b.get('summary',{}); tw+=s.get('wins',0); tl+=s.get('losses',0); tt+=s.get('ties',0)
            bd=b.get('breakdowns',{})
            def worst(section,min_n=3):
              vals=[]
              for k,v in (bd.get(section,{}) or {}).items():
                n=v.get('n',0); a=v.get('accuracyExTies')
                if n>=min_n and a is not None: vals.append((a,-n,k,v))
              if not vals:return None
              a,nn,k,v=min(vals)
              return {'key':k,'n':v.get('n',0),'wins':v.get('wins',0),'losses':v.get('losses',0),'ties':v.get('ties',0),'accuracy':a}
            sh=b.get('shadow',{}) or {}; sr+=sh.get('ready',0); sa+=sh.get('agreements',0); sd+=sh.get('disagreements',0)
            rows.append({
              'pair':b.get('pair'),'horizon':b.get('horizon'),'batch':b.get('batchNumber'),
              'wins':s.get('wins'),'losses':s.get('losses'),'ties':s.get('ties'),'accuracy':s.get('accuracyExTies'),
              'maxLossStreak':b.get('maxLossStreak'),'lossRuns4Plus':b.get('lossRuns4Plus'),'lossRuns5Plus':b.get('lossRuns5Plus'),
              'worstConfidence':worst('confidence',3),'worstDirection':worst('direction',3),'worstRegime':worst('regime',3),
              'worstHour':worst('hour',3),'worstSafeguard':worst('safeguard',3),
              'shadow':{'ready':sh.get('ready',0),'agreements':sh.get('agreements',0),'disagreements':sh.get('disagreements',0)}
            })
          decided=tw+tl
          out={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sourceGeneratedAt':d.get('generatedAt'),'integrityStatus':d.get('integrityStatus'),'lineageRule':d.get('lineageRule'),'newBatchCount':len(rows),'totals':{'wins':tw,'losses':tl,'ties':tt,'accuracy':round(100*tw/decided,2) if decided else None},'shadowTotals':{'ready':sr,'agreements':sa,'disagreements':sd},'batches':rows}
          pathlib.Path('audit/self-healing-compact-latest.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Commit compact evidence
        run: |
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/self-healing-compact-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: compact 24-batch self-healing evidence"
          git pull --rebase origin main
          git push origin main
