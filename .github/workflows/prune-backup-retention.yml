name: Prune backup snapshots to 3 days

on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-backup-retention.yml'

permissions:
  contents: write

concurrency:
  group: forex-falcon-backup-retention
  cancel-in-progress: false

jobs:
  prune:
    if: ${{ !contains(github.event.head_commit.message || '', '[backup-prune]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove dated backup/audit snapshots older than 3 days
        shell: bash
        run: |
          set -euo pipefail

          # Keep today + previous 2 UTC calendar days.
          cutoff="$(date -u -d '2 days ago' +%Y-%m-%d)"
          echo "Retention cutoff: keep dated snapshots >= ${cutoff}"

          # IMPORTANT: canonical settlements and learning/integrity state are excluded.
          protected_prefixes=(
            'audit/canonical/'
            'audit/integrity/'
            'audit/research-log/'
            'audit/strategy-changes/'
            'audit/modifications/'
            'audit/new-batches/'
            'audit/quarantine/'
          )

          is_protected() {
            local p="$1"
            for prefix in "${protected_prefixes[@]}"; do
              [[ "$p" == "$prefix"* ]] && return 0
            done
            return 1
          }

          deleted=0
          while IFS= read -r -d '' file; do
            is_protected "$file" && continue

            base="$(basename "$file")"
            # Extract first YYYY-MM-DD occurring in the filename.
            if [[ "$base" =~ ([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              file_date="${BASH_REMATCH[1]}"
              if [[ "$file_date" < "$cutoff" ]]; then
                case "$file" in
                  audit/automation-health-checkpoint-*|\
                  audit/health-checkpoint-*|\
                  audit/health-checkpoints/*|\
                  audit/selector-telemetry/*|\
                  audit/self-healing-checkpoint-*|\
                  audit/self-healing-cycle-*|\
                  audit/forward-validation-cycle-* )
                    echo "Pruning old backup snapshot: $file"
                    rm -f -- "$file"
                    deleted=$((deleted + 1))
                    ;;
                esac
              fi
            fi
          done < <(find audit -type f -print0 2>/dev/null || true)

          # Remove empty snapshot directories only; protected directories remain.
          find audit/health-checkpoints audit/selector-telemetry -type d -empty -delete 2>/dev/null || true

          echo "Deleted ${deleted} old backup snapshot file(s)."

      - name: Commit retention cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nothing older than the 3-day retention window.'
            exit 0
          fi

          git config user.name 'Forex Falcon Backup Retention'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'maintenance: prune backups older than 3 days [backup-prune]'
          git push
