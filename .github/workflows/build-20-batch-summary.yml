name: Build 20-result batch summary

# Audit refresh trigger: 2026-09-04T10:49Z. Keep this workflow manually rerunnable and push-triggered on its own file.
on:
  push:
    paths:
      - '.github/workflows/build-20-batch-summary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build exact post-baseline track summary
        env:
          BASELINE_MS: '1788388509000'
          PAIRS: EURUSD GBPUSD EURJPY USDJPY AUDUSD
          HORIZONS: 1 2 3 5 15
        run: |
          set -euo pipefail
          mkdir -p audit/new-batches
          jq -n --arg capturedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson baselineMs "$BASELINE_MS" '{capturedAt:$capturedAt,baselineMs:$baselineMs,tracks:{}}' > /tmp/status.json
          for pair in $PAIRS; do
            slug=$(echo "$pair" | tr '[:upper:]' '[:lower:]')
            for h in $HORIZONS; do
              key="${pair}-${h}M"
              jq --argjson h "$h" --argjson b "$BASELINE_MS" '[.[] | select((.horizon|tonumber)==$h and ((.resolvedAt // .expiry // .signalBoundary // 0)|tonumber)>$b)] | sort_by(.resolvedAt // .expiry // .signalBoundary // 0)' "audit/resolved/$slug.json" > "/tmp/$slug-$h-new.json"
              n=$(jq 'length' "/tmp/$slug-$h-new.json")
              completed=$((n/20)); rem=$((n%20))
              jq --arg key "$key" --arg pair "$pair" --argjson h "$h" --argjson n "$n" --argjson completed "$completed" --argjson rem "$rem" '.tracks[$key]={pair:$pair,horizon:$h,newSinceBaseline:$n,completed20Batches:$completed,remainder:$rem}' /tmp/status.json > /tmp/status2.json && mv /tmp/status2.json /tmp/status.json
              if [ "$completed" -gt 0 ]; then
                for batch in $(seq 1 "$completed"); do
                  start=$(( (batch-1)*20 ));
                  jq --argjson s "$start" '.[$s:$s+20]' "/tmp/$slug-$h-new.json" > "audit/new-batches/$slug-${h}m-batch-${batch}.json"
                done
              fi
            done
          done
          mv /tmp/status.json audit/exact-20-batch-status.json
      - name: Commit summary
        run: |
          set -euo pipefail
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/exact-20-batch-status.json audit/new-batches
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: build exact 20-result batch summary"
          git push
