name: Enable continuous streak audit
on:
  push:
    paths:
      - '.github/workflows/enable-continuous-streak-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enable hourly and post-capture analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/analyze-all-track-loss-streaks.yml')
          s=p.read_text()
          old="""on:\n  workflow_dispatch:\n  push:\n    paths:\n      - '.github/workflows/analyze-all-track-loss-streaks.yml'\n"""
          new="""on:\n  workflow_dispatch:\n  schedule:\n    - cron: '23 * * * *'\n  workflow_run:\n    workflows: ['Capture Live Core FX Audit']\n    types: [completed]\n  push:\n    paths:\n      - '.github/workflows/analyze-all-track-loss-streaks.yml'\n"""
          if old not in s: raise SystemExit('trigger anchor not found')
          s=s.replace(old,new,1)
          oldjob="""  analyze:\n    runs-on: ubuntu-latest\n"""
          newjob="""  analyze:\n    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}\n    runs-on: ubuntu-latest\n"""
          if oldjob not in s: raise SystemExit('job anchor not found')
          p.write_text(s.replace(oldjob,newjob,1))
          PY
      - name: Commit trigger upgrade
        run: |
          git config user.name 'Forex Falcon Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/analyze-all-track-loss-streaks.yml
          git commit -m 'audit: run loss-streak diagnostics hourly and after capture'
          git pull --rebase origin main
          git push origin HEAD:main
