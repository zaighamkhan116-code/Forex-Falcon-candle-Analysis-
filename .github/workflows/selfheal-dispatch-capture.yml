name: Self-heal Canonical Capture Dispatch

on:
  push:
    paths:
      - '.github/workflows/selfheal-dispatch-capture.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-latest-main:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical capture from latest main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/capture-live-audit.yml/dispatches" \
            -d '{"ref":"main"}'
