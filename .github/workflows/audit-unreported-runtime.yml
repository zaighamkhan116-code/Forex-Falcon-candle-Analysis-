name: Audit unreported runtime diagnostics
on:
  push:
    paths:
      - '.github/workflows/audit-unreported-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate rerank shadow and dead-market evidence
        run: |
          python3 - <<'PY'
          import json,glob,re
          from collections import Counter,defaultdict
          state=json.load(open('audit/automation-state-20-batch.json'))
          reported=state.get('reportedBatches',{})
          rows=[]
          for p in glob.glob('audit/new-batches/*.json'):
              m=re.search(r'/([a-z]+)-(\d+)m-batch-(\d+)\.json$',p)
              if not m: continue
              pair=m.group(1).upper(); h=int(m.group(2)); b=int(m.group(3)); track=f'{pair}-{h}M'
              if b<=int(reported.get(track,0) or 0): continue
              for r in json.load(open(p)):
                  r['_track']=track;r['_batch']=b;rows.append(r)
          def perf(xs):
              c=Counter(str(x.get('result')) for x in xs); d=c['WIN']+c['LOSS']
              return {'n':len(xs),'W':c['WIN'],'L':c['LOSS'],'T':c['TIE'],'accuracy':round(100*c['WIN']/d,1) if d else None}
          reranked=[r for r in rows if (r.get('features') or {}).get('directionReranked') is True]
          notreranked=[r for r in rows if (r.get('features') or {}).get('directionReranked') is not True]
          shadows=Counter(str((r.get('shadowModel') or {}).get('status','MISSING')) for r in rows)
          ready=[r for r in rows if (r.get('shadowModel') or {}).get('status')=='READY']
          arb=Counter()
          bothloss=[]
          for r in ready:
              s=r.get('shadowModel') or {}; fd=str(r.get('direction')); sd=str(s.get('direction')); fr=str(r.get('result')); sr=str(s.get('result'))
              if fd==sd:
                  arb['AGREE_BUY' if fd=='BUY' else 'AGREE_SELL']+=1
                  arb['AGREEMENT_'+fr]+=1
                  if fr=='LOSS': bothloss.append(r)
              else:
                  if fr=='WIN' and sr=='LOSS':arb['DISAGREE_FALCON_WIN']+=1
                  elif fr=='LOSS' and sr=='WIN':arb['DISAGREE_SHADOW_WIN']+=1
                  else:arb['DISAGREE_TIE_OR_UNDECIDED']+=1
          def dead(r):
              f=r.get('features') or {}
              rel=f.get('relativeVolume'); tr=str(f.get('tickReliabilityState',''))
              return ((isinstance(rel,(int,float)) and rel<0.5) or tr in ('WEAK','UNAVAILABLE') or f.get('vsaNarrowSpread') is True or f.get('microRangeChop') is True)
          deadrows=[r for r in rows if dead(r)]
          live=[r for r in rows if not dead(r)]
          bytrack={}
          for track in sorted({r['_track'] for r in rows}):
              xs=[r for r in rows if r['_track']==track]
              rr=[r for r in xs if (r.get('features') or {}).get('directionReranked') is True]
              dr=[r for r in xs if dead(r)]
              bytrack[track]={'all':perf(xs),'reranked':perf(rr),'deadLowVolume':perf(dr),'rerankN':len(rr),'deadLowVolumeN':len(dr)}
          out={'rows':len(rows),'batches':len(set((r['_track'],r['_batch']) for r in rows)),'rerank':{'true':perf(reranked),'false':perf(notreranked)},'shadowStatus':dict(shadows),'shadowReadyN':len(ready),'arbitration':dict(arb),'bothModelLossN':len(bothloss),'deadLowVolume':{'flagged':perf(deadrows),'other':perf(live)},'byTrack':bytrack}
          json.dump(out,open('audit/unreported-runtime-audit.json','w'),indent=2)
          PY
      - name: Commit runtime audit
        run: |
          git config user.name "Forex Falcon Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add audit/unreported-runtime-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: summarize unreported runtime diagnostics"
          git push
